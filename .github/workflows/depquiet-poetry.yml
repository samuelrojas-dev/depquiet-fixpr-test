name: depquiet fixes (Poetry)
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: samuelrojas-dev/depquiet@v0
        id: depquiet
        with:
          path: poetry-app
          fix-pr: "true"
          fix-pr-branch: depquiet/poetry-fixes
          fail-on-action: "false"
      - env:
          PR_URL: ${{ steps.depquiet.outputs.fix-pr-url }}
        run: |
          echo "Fix pull request: $PR_URL"
